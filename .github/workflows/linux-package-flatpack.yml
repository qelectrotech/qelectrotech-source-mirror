jobs:
  flatpak:
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.9
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.variant.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          fetch-depth: 0
          lfs: false

      - name: Extract version
        id: qet_version
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < QET_VERSION)"
          RELEASE="$(tr -d '[:space:]' < QET_RELEASE)"

          case "$RELEASE" in
            dev)
              SUFFIX="-r$(git rev-list HEAD --count)-$(git rev-parse --short HEAD)"
              ;;
            alpha1|alpha2|alpha3)
              SUFFIX="-${RELEASE}"
              ;;
            stable)
              SUFFIX=""
              ;;
            *)
              echo "ERROR: unrecognized QET_RELEASE value '$RELEASE'" >&2
              exit 1
              ;;
          esac

          echo "version=${VERSION}${SUFFIX}" >> "$GITHUB_OUTPUT"

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: qelectrotech-${{ steps.qet_version.outputs.version }}-${{ matrix.variant.arch }}.flatpak
          artifact-name: qelectrotech-flatpak-${{ matrix.variant.arch }}
          manifest-path: build-aux/flatpak/org.qelectrotech.QElectroTech.json
          cache-key: flatpak-builder-${{ matrix.variant.arch }}-${{ github.sha }}
          arch: ${{ matrix.variant.arch }}
          verbose: true
