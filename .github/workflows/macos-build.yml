name: macOS Build Check

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Qt ${{ matrix.qt_version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
        qt_version: [5, 6]
    continue-on-error: ${{ matrix.qt_version == 6 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          path: source

      - name: Install Qt5 dependencies
        if: matrix.qt_version == 5
        run: |
          brew install qt@5 cmake ninja ccache pkg-config sqlite

      - name: Install Qt6 dependencies
        if: matrix.qt_version == 6
        run: |
          brew install qt cmake ninja ccache pkg-config sqlite

#      - name: Cache ccache
#        uses: actions/cache@v5
#        with:
#          path: ~/Library/Caches/ccache
#          key: ccache-macos-qt${{ matrix.qt_version }}-${{ github.ref_name }}-${{ github.sha }}
#          restore-keys: |
#            ccache-macos-qt${{ matrix.qt_version }}-${{ github.ref_name }}-
#            ccache-macos-qt${{ matrix.qt_version }}-

      - name: Configure, build, install
        run: |
          set -euo pipefail
          SOURCE_DIR="${{ github.workspace }}/source"
          BUILD_DIR="${{ github.workspace }}/build"
          INSTALL_DIR="${{ github.workspace }}/install"
          QT_PREFIX="$(brew --prefix qt@${{ matrix.qt_version }})"

          cmake -S "$SOURCE_DIR" -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DQT_VERSION_MAJOR=${{ matrix.qt_version }} \
            -DBUILD_WITH_KF=OFF \
            -DPACKAGE_TESTS=OFF \
            -DCMAKE_POLICY_DEFAULT_CMP0077=NEW \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

          cmake --build "$BUILD_DIR" -j"$(sysctl -n hw.ncpu)"
          cmake --install "$BUILD_DIR" --prefix "$INSTALL_DIR"
