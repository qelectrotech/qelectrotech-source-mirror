name: Linux Build Check

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Qt ${{ matrix.qt_version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - ubuntu-24.04
          - ubuntu-26.04
        qt_version: [5, 6]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          path: source

      - name: Install Qt5 dependencies
        if: matrix.qt_version == 5
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt5-qmake qtbase5-dev qtbase5-private-dev qttools5-dev qttools5-dev-tools libqt5svg5-dev libqt5sql5-sqlite qttranslations5-l10n \
            libsqlite3-dev cmake ninja-build ccache pkg-config g++
            
          # Install OpenGL fix for Ubuntu 22.04
          if [[ "${{ matrix.os }}" == "ubuntu-22.04" || "${{ matrix.os }}" == "ubuntu-22.04-arm" ]]; then
            sudo apt-get install -y libgl1-mesa-dev libegl1-mesa-dev
          fi

      - name: Install Qt6 dependencies
        if: matrix.qt_version == 6
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev qt6-base-private-dev libqt6svg6-dev libqt6sql6-sqlite qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools qt6-base-private-dev \
            libsqlite3-dev cmake ninja-build ccache pkg-config g++
            
          # Install OpenGL fix for Ubuntu 22.04
          if [[ "${{ matrix.os }}" == "ubuntu-22.04" || "${{ matrix.os }}" == "ubuntu-22.04-arm" ]]; then
            sudo apt-get install -y libgl1-mesa-dev libegl1-mesa-dev
          fi

#      - name: Cache ccache
#        uses: actions/cache@v5
#        with:
#          path: ~/.ccache
#          key: ccache-linux-qt${{ matrix.qt_version }}-${{ github.ref_name }}-${{ github.sha }}
#          restore-keys: |
#            ccache-linux-qt${{ matrix.qt_version }}-${{ github.ref_name }}-
#            ccache-linux-qt${{ matrix.qt_version }}-

      - name: Configure, build, install
        run: |
          set -euo pipefail
          SOURCE_DIR="${{ github.workspace }}/source"
          BUILD_DIR="${{ github.workspace }}/build"
          INSTALL_DIR="${{ github.workspace }}/install"

          cmake -S "$SOURCE_DIR" -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_VERSION_MAJOR=${{ matrix.qt_version }} \
            -DBUILD_WITH_KF=OFF \
            -DPACKAGE_TESTS=OFF \
            -DCMAKE_POLICY_DEFAULT_CMP0077=NEW \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

          cmake --build "$BUILD_DIR" -j"$(nproc)"
          cmake --install "$BUILD_DIR" --prefix "$INSTALL_DIR"
