name: FreeBSD Build Check

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-freebsd:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        qt_version: [5, 6]
    continue-on-error: ${{ matrix.qt_version == 6 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          path: source

      - name: Build on FreeBSD (via VM)
        uses: cross-platform-actions/action@v1.4.0
        with:
          operating_system: freebsd
          version: '15.1'
          shell: bash
          run: |
            set -euo pipefail

            if [ "${{ matrix.qt_version }}" = "5" ]; then
              sudo pkg install -y git qt5 qt5-qmake qt5-buildtools qt5-core qt5-gui qt5-widgets \
                qt5-svg qt5-sql qt5-sqldrivers-sqlite3 qt5-linguisttools qt5-printsupport cmake ninja ccache \
                pkgconf sqlite3
            else
              sudo pkg install -y git qt6 \
                cmake ninja ccache pkgconf sqlite3
            fi

            SOURCE_DIR="$PWD/source"
            BUILD_DIR="$PWD/build"
            INSTALL_DIR="$PWD/install"

            cmake -S "$SOURCE_DIR" -B "$BUILD_DIR" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DQT_VERSION_MAJOR=${{ matrix.qt_version }} \
              -DBUILD_WITH_KF=OFF \
              -DPACKAGE_TESTS=OFF \
              -DCMAKE_POLICY_DEFAULT_CMP0077=NEW \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

            cmake --build "$BUILD_DIR" -j"$(sysctl -n hw.ncpu)"
            cmake --install "$BUILD_DIR" --prefix "$INSTALL_DIR"
