name: Package Linux Snap

on:
  workflow_call:
  workflow_dispatch:
  # Temporarily also on push/PR while this is actively being iterated on --
  # dial back once it's proven, same as the DMG and AppImage workflows.
  # pull_request:
  # push:
  #   branches: [master]

concurrency:
  group: linux-package-snap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-snap:
    name: Package Snap (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build snap
        id: snapcraft
        uses: snapcore/action-build@v1

      - name: Upload snap artifact
        uses: actions/upload-artifact@v7
        with:
          name: qelectrotech-snap-${{ matrix.arch }}
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error
          retention-days: 40

      # Only attempts to publish if the Snap Store credentials secret
      # actually exists -- same pattern as macos-package-dmg.yml's signing
      # gate, so this workflow runs fine (build + artifact only) before
      # anyone's decided to wire up real Snap Store publishing at all.
      - name: Determine snap channel
        id: channel
        run: |
          set -euo pipefail
          case "$(tr -d '[:space:]' < QET_RELEASE)" in
            dev) echo "channel=edge" >> "$GITHUB_OUTPUT" ;;
            alpha1|alpha2) echo "channel=beta" >> "$GITHUB_OUTPUT" ;;
            alpha3) echo "channel=candidate" >> "$GITHUB_OUTPUT" ;;
            stable) echo "channel=stable" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Publish to Snap Store
        if: ${{ env.SNAPCRAFT_STORE_CREDENTIALS != '' }}
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          release: ${{ steps.channel.outputs.channel }}

