name: Build Linux AppImage

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

jobs:
  build-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates build-essential cmake ninja-build git pkg-config \
            qt6-base-dev qt6-base-dev-tools qt6-base-private-dev qt6-tools-dev qt6-tools-dev-tools \
            libqt6svg6-dev libsqlite3-dev libcups2-dev \
            libxkbcommon-x11-0 wget file patchelf

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_VERSION_MAJOR=6 \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_WITH_KF=OFF \
            -DQET_EXPORT_PROJECT_DB=ON

      - name: Build QElectroTech
        run: cmake --build build --parallel $(nproc)

      - name: Install into AppDir
        run: DESTDIR=${PWD}/AppDir cmake --install build

      - name: Download linuxdeploy and plugins
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          QMAKE: /usr/lib/qt6/bin/qmake
        run: |
          mkdir -p AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp misc/org.qelectrotech.qelectrotech.desktop AppDir/usr/share/applications/
          cp ico/256x256/qelectrotech.png AppDir/usr/share/icons/hicolor/256x256/apps/
          cp misc/org.qelectrotech.qelectrotech.desktop AppDir/
          cp ico/256x256/qelectrotech.png AppDir/qelectrotech.png

          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/org.qelectrotech.qelectrotech.desktop \
            --icon-file AppDir/qelectrotech.png \
            --plugin qt \
            --output appimage

          mv QElectroTech-*-x86_64.AppImage QElectroTech-x86_64.AppImage || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QElectroTech-Linux-x86_64-AppImage
          path: QElectroTech-*.AppImage

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: QElectroTech-*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
