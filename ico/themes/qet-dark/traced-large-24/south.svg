<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <style type="text/css" id="current-color-scheme">
      .ColorScheme-Text { color:#dcdcdc; }
      .ColorScheme-Highlight { color:#1892d2; }
    </style>
  </defs>
  <g transform="translate(1,1)">
  <rect x="4" y="3" width="15" height="1" class="ColorScheme-Text" style="fill:currentColor"/>
  <rect x="10" y="4" width="3" height="11" style="fill:#ff0000"/>
  <rect x="10" y="15" width="3" height="3" class="ColorScheme-Highlight" style="fill:currentColor"/>
  </g>
</svg>
