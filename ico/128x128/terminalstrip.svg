  <g fill="#31363b">
    <circle cx="20" cy="50" r="4.5"/><circle cx="20" cy="74" r="4.5"/>
    <circle cx="38" cy="50" r="4.5"/><circle cx="38" cy="74" r="4.5"/>
    <circle cx="56" cy="50" r="4.5"/><circle cx="56" cy="74" r="4.5"/>
