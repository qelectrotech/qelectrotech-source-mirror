    <rect x="66" y="26" width="16" height="66" rx="2"/>
    <rect x="84" y="26" width="16" height="66" rx="2"/>
    <rect x="102" y="26" width="16" height="66" rx="2"/>
  </g>
  <!-- right-hand shading of each block -->
  <g fill="#bdc3c7">
    <rect x="24" y="28" width="4" height="62"/>
